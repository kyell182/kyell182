# Genereert de stats-kaarten en de snake voor de profiel-README.
# Draait dagelijks, bij elke push van dit bestand en handmatig via het Actions-tabblad.
name: Profiel bijwerken

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-24.04
    steps:
      # De action commit zijn kaarten in deze repo, dus de repo moet eerst uitgecheckt zijn
      - uses: actions/checkout@v5

      # Zet SVG-kaarten in profile-summary-card-output/ (geen externe server nodig)
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 1

  snake:
    runs-on: ubuntu-24.04
    steps:
      # Snake in VIVES-rood, een lichte en een donkere versie
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E30613&color_dots=#ebedf0,#ffc9cc,#ff8a93,#e8414e,#b8000f
            dist/snake-dark.svg?palette=github-dark&color_snake=#2FE0FF&color_dots=#161b22,#4a0a10,#8a0c18,#c4101f,#ff2b3d

      # Publiceert de SVG's op de branch "output" met gewone git (geen extra action nodig)
      - name: Publiceer snake op branch output
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Snake bijwerken"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output