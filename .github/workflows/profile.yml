# Genereert de stats-kaarten en de snake voor de profiel-README.
# Draait dagelijks, bij elke push naar main en handmatig via het Actions-tabblad.
name: Profiel bijwerken

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      # Zet SVG-kaarten in profile-summary-card-output/ in deze repo (geen externe server nodig)
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 1

  snake:
    runs-on: ubuntu-latest
    steps:
      # Snake in VIVES-rood, een lichte en een donkere versie
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E30613&color_dots=#ebedf0,#ffc9cc,#ff8a93,#e8414e,#b8000f
            dist/snake-dark.svg?palette=github-dark&color_snake=#2FE0FF&color_dots=#161b22,#4a0a10,#8a0c18,#c4101f,#ff2b3d

      # Publiceert de SVG's op de branch "output"
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
